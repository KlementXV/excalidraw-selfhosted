# Builds the Excalidraw front from the latest upstream release, or from a chosen ref.
#
# Nothing watches upstream: GitHub cannot trigger on a release of another repository.
# Run this manually to pick up a new release.
name: Excalidraw front

on:
  push:
    branches:
      - self-hosted
    paths:
      - "excalidraw-front/**"
      - ".github/workflows/excalidraw-front.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream tag or branch (empty: latest release)"
        required: false
        default: ""
      force:
        description: "Rebuild even if the image exists"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: excalidraw-front
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          FORCE: ${{ inputs.force }}
        run: |
          # Image names must be lowercase, GitHub owners do not have to be.
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/excalidraw-front"

          if [ -n "$INPUT_REF" ]; then
            ref="$INPUT_REF"
            is_latest=false
          else
            ref="$(gh api repos/excalidraw/excalidraw/releases/latest --jq .tag_name)"
            is_latest=true
          fi
          # A branch name such as feature/x is not a valid image tag.
          tag="$(printf '%s' "$ref" | tr -c 'A-Za-z0-9_.-' '-')"

          # A push changes the image itself, so it always rebuilds.
          if [ "$GITHUB_EVENT_NAME" != "push" ] && [ "$FORCE" != "true" ] \
            && docker manifest inspect "$image:$tag" > /dev/null 2>&1; then
            echo "$image:$tag already exists, nothing to build."
            build=false
          else
            build=true
          fi

          {
            echo "image=$image"
            echo "ref=$ref"
            echo "tag=$tag"
            echo "is_latest=$is_latest"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.release.outputs.build == 'true'

      - uses: docker/build-push-action@v7
        if: steps.release.outputs.build == 'true'
        with:
          context: excalidraw-front
          push: true
          build-args: |
            EXCALIDRAW_REF=${{ steps.release.outputs.ref }}
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
            ${{ steps.release.outputs.is_latest == 'true' && format('{0}:latest', steps.release.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.ref }}

      - name: Open a pull request to update the chart
        if: steps.release.outputs.is_latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.release.outputs.ref }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          current="$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' chart/Chart.yaml)"
          if [ "$current" = "$REF" ]; then
            echo "The chart already uses $REF."
            exit 0
          fi

          # The next chart version: bump the patch number.
          version="$(sed -n 's/^version: //p' chart/Chart.yaml)"
          next="${version%.*}.$(( ${version##*.} + 1 ))"
          sed -i "s/^appVersion: .*/appVersion: \"$REF\"/; s/^version: .*/version: $next/" chart/Chart.yaml

          branch="chart/excalidraw-$REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add chart/Chart.yaml
          git commit -m "chore(chart): use Excalidraw $REF"
          git push --force origin "$branch"

          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "$BASE" --head "$branch" \
              --title "chore(chart): use Excalidraw $REF" \
              --body "The front image for $REF is published. Merging this publishes chart version $next."
          fi
