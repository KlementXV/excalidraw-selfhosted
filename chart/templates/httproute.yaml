{{- if .Values.gateway.enabled -}}
{{- if not .Values.gateway.parentRefs }}
{{- fail "gateway.parentRefs is required when gateway.enabled is true" }}
{{- end -}}
{{- $fullname := include "excalidraw.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "excalidraw.labels" (dict "ctx" . "component" "front") | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ include "excalidraw.host" . | quote }}
  rules:
    {{- if and .Values.mcp.enabled .Values.mcp.expose }}
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: {{ $fullname }}-mcp
          port: 3001
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $fullname }}-front
          port: 8080
{{- end }}
